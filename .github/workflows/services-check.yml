name: Services quality check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "src/services/**"
      - ".github/workflows/services-check.yml"

permissions:
  contents: read

jobs:
  # Always runs, so the jobs below always report and can be required by
  # main's ruleset. They skip when the pull request touches nothing here.
  # The list is what `on.pull_request.paths` used to carry, and must stay
  # in step with `on.push.paths`.
  changes:
    name: Decide whether this check applies
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changed-paths.yml
    with:
      paths: |
        src/services/**
        .github/workflows/services-check.yml

  services-quality:
    name: Type-check and test services
    needs: changes
    # Runs unless the decision is exactly "false", so a failed decision
    # runs the check rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/services/package-lock.json

      - name: Install dependencies
        working-directory: src/services
        run: npm ci

      - name: Type-check
        working-directory: src/services
        run: npm run check

      - name: Test
        working-directory: src/services
        run: npm run test

  # The container bundles the dashboard with esbuild resolved from the npm
  # workspace, so a dependency update that changes hoisting breaks the image
  # without failing the job above.
  container-build:
    name: Build feedback-intake container
    needs: changes
    # Runs unless the decision is exactly "false", so a failed decision
    # runs the check rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        working-directory: src/services
        run: docker build -f feedback-intake/Dockerfile -t practice-takes-feedback:ci .

      - name: Verify the image runs and stayed unprivileged
        run: |
          runtime_user="$(docker run --rm --entrypoint id practice-takes-feedback:ci -un)"
          if [[ "${runtime_user}" == "root" ]]; then
            echo "The container must not run as root." >&2
            exit 1
          fi
          echo "Runtime user: ${runtime_user}"

          docker run --rm --entrypoint node practice-takes-feedback:ci --version
          docker run --rm --entrypoint node practice-takes-feedback:ci \
            --check dist/docker-server.js
