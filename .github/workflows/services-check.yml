name: Services quality check

on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services-check.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/services-check.yml"

permissions:
  contents: read

jobs:
  services-quality:
    name: Type-check and test services
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Install dependencies
        working-directory: services
        run: npm ci

      - name: Type-check
        working-directory: services
        run: npm run check

      - name: Test
        working-directory: services
        run: npm run test
