name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly full-history sweep, which push and pull_request scans do not cover.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # For the failure reports below. A weekly scan that has been red for a month
  # is worse than no scan, because the repository looks guarded while it is not.
  issues: write

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  # A pull request rescans every commit it carries, so superseding a run loses
  # nothing. A push scans only its own commit range and must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Scan commits for secret content
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The SARIF report quotes matched secrets verbatim and workflow
          # artifacts on a public repository are downloadable by anyone.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      # Not on pull requests: that failure is already red in front of the author.
      # Not on workflow_dispatch: whoever pressed the button is watching. See #159.
      - name: Report the failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/ci/report_workflow_failure.py \
            --title "Secret scan: unattended run is failing" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}" \
            --trigger "${GITHUB_EVENT_NAME}" \
            --failing-step "Run gitleaks" \
            --label area:build \
            --label area:tooling \
            --label type:security \
            --label priority:p1 \
            --guidance "gitleaks failing may mean it found a secret in history rather than that the scan broke. Read the run before assuming it is a tooling problem, and if a real credential is named, treat it as live and rotate it before closing this."

  tracked-plaintext:
    name: Reject tracked plaintext secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Match tracked files against tools/secret-patterns
        id: audit
        run: python3 tools/scripts/secrets/secrets_manager.py audit

      # Shares the gitleaks title deliberately: both jobs guard the same thing,
      # and one thread carrying both is easier to act on than two.
      - name: Report the failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/ci/report_workflow_failure.py \
            --title "Secret scan: unattended run is failing" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}" \
            --trigger "${GITHUB_EVENT_NAME}" \
            --failing-step "Match tracked files against tools/secret-patterns" \
            --label area:build \
            --label area:tooling \
            --label type:security \
            --label priority:p1 \
            --guidance "A tracked plaintext file matches \`tools/secret-patterns\`. The pre-commit hook that normally catches this only runs once installed, so a clone without \`pre-commit install\` is the usual cause."
