name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly full-history sweep, which push and pull_request scans do not cover.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  # A pull request rescans every commit it carries, so superseding a run loses
  # nothing. A push scans only its own commit range and must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Scan commits for secret content
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The SARIF report quotes matched secrets verbatim and workflow
          # artifacts on a public repository are downloadable by anyone.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  tracked-plaintext:
    name: Reject tracked plaintext secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Match tracked files against secret-patterns
        run: python3 scripts/secrets/secrets_manager.py audit
