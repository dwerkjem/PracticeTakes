# THROWAWAY. Task 1.1 of openspec/changes/verify-audio-thread-contract.
#
# The project has only ever been built with GCC. Before committing CI to a
# clang toolchain for RealtimeSanitizer, find out two things and delete this
# file:
#
#   1. Does PracticeTakesTests compile and pass under clang-20?
#   2. Does that clang accept -fsanitize=realtime?
#
# Every step is `continue-on-error` on purpose. A red X here is a finding, not
# a broken build — the point is to read the output, not to gate anything.
name: clang spike (throwaway)

on:
  push:
    branches:
      - feat/verify-audio-thread-contract

permissions:
  contents: read

jobs:
  spike:
    name: Build the test suite with clang-20
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install build dependencies
        run: bash tools/scripts/build/check-linux-build-dependencies.sh --install

      - name: Install clang-20
        id: install
        continue-on-error: true
        run: |
          set -x
          if ! sudo apt-get install --yes clang-20; then
            echo "clang-20 is not in the runner's apt sources; adding apt.llvm.org"
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            source /etc/os-release
            echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-20 main" \
              | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install --yes clang-20
          fi
          clang-20 --version

      - name: Does this clang accept -fsanitize=realtime?
        id: rtsan
        continue-on-error: true
        run: |
          set -x
          printf 'int main(void) { return 0; }\n' > /tmp/probe.c
          clang-20 -fsanitize=realtime /tmp/probe.c -o /tmp/probe
          /tmp/probe
          echo "RTSAN=supported" >> "$GITHUB_OUTPUT"

      # The first attempt put the attribute before the declaration and clang
      # rejected it: these are function *type* attributes and go after the
      # parameter list, like noexcept. Probing the real shape -- a virtual
      # override, which is what the audio callback is.
      - name: Does the nonblocking attribute compile where we need it?
        id: attribute
        continue-on-error: true
        run: |
          set -x
          cat > /tmp/nb.cpp <<'PROBE'
          struct Base { virtual void callback(float*, int) = 0; virtual ~Base() = default; };
          struct Impl : Base {
              void callback(float* out, int n) [[clang::nonblocking]] override {
                  for (int i = 0; i < n; ++i) out[i] = 0.0f;
              }
          };
          int main() { float buffer[4]{}; Impl impl; impl.callback(buffer, 4); }
          PROBE
          clang++-20 -std=c++20 -Wall -Wextra -Werror /tmp/nb.cpp -o /tmp/nb
          /tmp/nb

      # Compiling with -fsanitize=realtime proves the flag is accepted. It does
      # not prove anything is detected. This allocates inside a nonblocking
      # function and requires a non-zero exit -- if RTSan is inert, this step
      # "passing" would be the false confidence the whole change exists to end.
      - name: Does RealtimeSanitizer actually catch an allocation?
        id: rtsan_detects
        continue-on-error: true
        run: |
          set -x
          cat > /tmp/detect.cpp <<'PROBE'
          #include <vector>
          void offender(int n) [[clang::nonblocking]] {
              std::vector<float> allocated(static_cast<std::size_t>(n));
              (void) allocated.size();
          }
          int main() { offender(8); }
          PROBE
          clang++-20 -std=c++20 -fsanitize=realtime /tmp/detect.cpp -o /tmp/detect
          if /tmp/detect; then
            echo "RTSAN DID NOT DETECT THE ALLOCATION — the leg would be worthless"
            exit 1
          fi
          echo "RTSan aborted on the allocation, as required"

      - name: Configure with clang-20
        id: configure
        continue-on-error: true
        run: |
          set -x
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20

      - name: Build PracticeTakesTests with clang-20
        id: build
        continue-on-error: true
        run: |
          set -x
          cmake --build build-clang --target PracticeTakesTests --parallel 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Run the suite
        id: test
        continue-on-error: true
        run: ctest --test-dir build-clang --output-on-failure

      - name: What broke
        if: always()
        run: |
          echo "### clang-20 spike" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| install clang-20 | ${{ steps.install.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| -fsanitize=realtime accepted | ${{ steps.rtsan.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nonblocking attribute compiles | ${{ steps.attribute.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RTSan detects an allocation | ${{ steps.rtsan_detects.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| configure | ${{ steps.configure.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ${{ steps.build.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ctest | ${{ steps.test.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/build.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>First 60 diagnostics</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|warning:" /tmp/build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi
