name: Create Practice Takes release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Create {0} release', inputs.bump) || format('Publish {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Choose how VERSION should increase
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      skip_manual_verification:
        description: >-
          Release without a current full manual GUI verification run. Off by
          default; requires a reason, and both are recorded with the release.
        required: false
        default: false
        type: boolean
      skip_manual_verification_reason:
        description: Why manual verification is being skipped.
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: practice-takes-main-quality-and-release
  queue: max
  cancel-in-progress: false

jobs:
  # Runs before any artifact is built. This is what makes the manual GUI
  # harness load-bearing rather than optional.
  #
  # A record can never name the commit that contains it -- the run verifies a
  # commit, and its record is committed afterwards -- so this matches on code
  # state instead: the verified commit must be an ancestor of the release
  # commit, with no release-affecting file changed since.
  manual-verification:
    name: Manual verification gate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      # The tag path has no workflow inputs, so it cannot carry a skip. Its
      # equivalent is a committed marker file, which is a reviewable decision
      # rather than a checkbox -- the asymmetry is deliberate and documented in
      # docs/development/quality/TESTING_SUITE.md.
      - name: Check for a committed skip marker
        id: marker
        shell: bash
        run: |
          if [ -f .manual-verification-skip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<EOF"
              cat .manual-verification-skip
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify a current full manual run exists
        shell: bash
        env:
          SKIP_INPUT: ${{ github.event.inputs.skip_manual_verification }}
          SKIP_REASON: ${{ github.event.inputs.skip_manual_verification_reason }}
          MARKER_PRESENT: ${{ steps.marker.outputs.present }}
          MARKER_REASON: ${{ steps.marker.outputs.reason }}
        run: |
          if [ "$SKIP_INPUT" = "true" ]; then
            python3 tools/scripts/release/check_manual_verification.py \
              --skip --skip-reason "$SKIP_REASON" | tee skip-notice.txt
          elif [ "$MARKER_PRESENT" = "true" ]; then
            python3 tools/scripts/release/check_manual_verification.py \
              --skip --skip-reason "$MARKER_REASON" | tee skip-notice.txt
          else
            python3 tools/scripts/release/check_manual_verification.py
          fi

      # Recorded with the release, not only in the workflow log, so "which
      # releases shipped without manual verification, and why" stays answerable
      # months later.
      - name: Record the outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Manual verification"
            echo
            if [ -f skip-notice.txt ]; then
              echo "**SKIPPED.**"
              echo
              echo '```'
              cat skip-notice.txt
              echo '```'
            else
              echo "A current, complete, full-mode manual run was found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the skip notice
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-verification-skip
          path: skip-notice.txt
          if-no-files-found: ignore

  prepare:
    name: Calculate release version
    needs: manual-verification
    runs-on: ubuntu-24.04
    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Calculate or validate version
        id: version
        shell: bash
        run: |
          current_version="$(python3 tools/scripts/release/version.py current)"
          source_sha="$(git rev-parse HEAD)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$(python3 tools/scripts/release/version.py next '${{ inputs.bump }}')"
            tag="v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists." >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"

            if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.0." >&2
              exit 1
            fi

            version="${tag#v}"

            if [[ "${current_version}" != "${version}" ]]; then
              echo "Tag ${tag} does not match VERSION (${current_version})." >&2
              exit 1
            fi
          fi

          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Release preparation"
            echo "- Current version: ${current_version}"
            echo "- Release version: ${version}"
            echo "- Tag: ${tag}"
            echo "- Source commit: ${source_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

  create-release-ref:
    name: Create immutable release commit and tag
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Check out selected release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Commit version and tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          python3 tools/scripts/release/version.py set "${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/VERSION tools/vcpkg.json
          git commit -m "chore(release): ${tag}"
          git tag -a "${tag}" -m "Practice Takes ${tag}"
          git push --atomic origin HEAD:main "refs/tags/${tag}"

      - name: Use existing version tag
        if: ${{ github.event_name == 'push' }}
        run: echo "Using existing tag ${{ needs.prepare.outputs.tag }}."

      - name: Record immutable release source
        id: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "- Immutable release commit: ${source_sha}" >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build release artifacts
    needs:
      - prepare
      - create-release-ref
    uses: ./.github/workflows/build-multiplatform.yml
    with:
      ref: ${{ needs.create-release-ref.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
    # Named one at a time rather than inherited so the build workflow only ever
    # receives the signing material. Every entry is optional: a secret that has
    # not been created resolves to an empty value and the matching signing step
    # skips itself.
    secrets:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish GitHub release from build artifacts
    needs:
      - prepare
      - create-release-ref
      - build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download release artifact bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: PracticeTakes-${{ needs.prepare.outputs.version }}-release-assets
          path: release-assets

      - name: Verify downloaded release artifacts
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          source_sha="${{ needs.create-release-ref.outputs.source_sha }}"

          expected_files=(
            "PracticeTakes-${version}-linux-x64.deb"
            "PracticeTakes-${version}-linux-arm64.deb"
            "PracticeTakes-${version}-windows-x64.exe"
            "PracticeTakes-${version}-windows-arm64.exe"
            "PracticeTakes-${version}-macos-x64.pkg"
            "PracticeTakes-${version}-macos-arm64.pkg"
            "SHA256SUMS.txt"
            "BUILD-METADATA.txt"
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -f "release-assets/${file}" ]]; then
              echo "Missing expected release artifact: ${file}" >&2
              exit 1
            fi
          done

          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "${actual_count}" -ne "${#expected_files[@]}" ]]; then
            echo "Expected ${#expected_files[@]} release files, found ${actual_count}." >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          grep -Fx "Version: ${version}" release-assets/BUILD-METADATA.txt
          grep -Fx "Source SHA: ${source_sha}" release-assets/BUILD-METADATA.txt

          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

      # The glob deliberately matches the one the publish step uploads from, so
      # the release notes can promise provenance for every published asset. The
      # step above has already proven the directory holds exactly the expected
      # files and nothing else.
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: release-assets/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<NOTES
          ### Verifying this download

          Every asset attached to this release, including SHA256SUMS.txt and
          BUILD-METADATA.txt, carries GitHub build provenance recorded for this
          workflow run. With the GitHub CLI:

              gh attestation verify <downloaded-file> --repo ${GITHUB_REPOSITORY}

          SHA256SUMS.txt covers the six installers:

              sha256sum --check SHA256SUMS.txt
          NOTES

          gh release create "${{ needs.prepare.outputs.tag }}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Practice Takes ${{ needs.prepare.outputs.tag }}" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest \
            --verify-tag
