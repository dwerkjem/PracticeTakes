name: Python quality check

on:
  pull_request:
    paths:
      - "tools/scripts/**"
      - ".github/workflows/python-check.yml"
      # The layout check below reads src/tests/ and src/, so a change to either has
      # to be able to fail it. Without these, a test added at the root of
      # src/tests/ would never trigger the job that rejects it.
      - "src/tests/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - "tools/scripts/**"
      - ".github/workflows/python-check.yml"
      - "src/tests/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: python-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Test repository scripts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report the interpreter under test
        run: python3 --version

      # The suite is standard-library only, so it runs on the runner's
      # preinstalled Python — the same interpreter the release, secret-scan,
      # and clang-tidy workflows already invoke these scripts with.
      - name: Run tests
        run: python3 tools/scripts/run_tests.py

      # src/tests/ mirrors src/ so a test's path names what it covers. Enforced
      # rather than trusted, because the tree was flat until recently and a new
      # test at the top level is an easy habit to fall back into.
      - name: Check the test layout mirrors the source tree
        run: python3 tools/scripts/quality/check_test_layout.py
