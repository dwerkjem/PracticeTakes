name: Clang-Tidy auto-fix on main

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "!src/services/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "tools/cmake/**"
      - "tools/scripts/quality/run_clang_format.py"
      - "tools/scripts/quality/run_clang_tidy.py"
      - "tools/scripts/build/check-linux-build-dependencies.sh"

permissions:
  contents: write

concurrency:
  group: practice-takes-main-quality-and-release
  queue: max
  cancel-in-progress: false

jobs:
  clang-tidy:
    name: Fix and lint merged C++
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install analysis dependencies
        run: |
          bash tools/scripts/build/check-linux-build-dependencies.sh --install
          sudo apt-get install --yes clang-format clang-tidy

      - name: Configure compilation database
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Generate JUCE headers and validate compilation
        run: cmake --build build --target PracticeTakes --parallel

      - name: Apply safe clang-tidy fixes
        shell: bash
        run: |
          mapfile -t cpp_files < <(find src -type f -name "*.cpp" -not -path "src/tests/*" -not -path "*/node_modules/*" | sort)
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "::error::No .cpp files discovered under src/ - refusing to report success on zero analyzed files."
            exit 1
          fi
          # clang-tidy can return a non-zero status while still applying valid
          # fix-its. Preserve those edits and verify unresolved findings later.
          python3 tools/scripts/quality/run_clang_tidy.py --fix "${cpp_files[@]}" || true

      - name: Format automatic edits
        shell: bash
        run: |
          mapfile -t cpp_files < <(find src -type f -name "*.cpp" -not -path "src/tests/*" -not -path "*/node_modules/*" | sort)
          mapfile -t header_files < <(find src -type f -name "*.h" -not -path "src/tests/*" -not -path "*/node_modules/*" | sort)
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "::error::No .cpp files discovered under src/ - refusing to report success on zero analyzed files."
            exit 1
          fi
          python3 tools/scripts/quality/run_clang_format.py "${cpp_files[@]}" "${header_files[@]}"

      - name: Validate automatic edits
        shell: bash
        run: |
          cmake --build build --target PracticeTakes --parallel
          mapfile -t cpp_files < <(find src -type f -name "*.cpp" -not -path "src/tests/*" -not -path "*/node_modules/*" | sort)
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "::error::No .cpp files discovered under src/ - refusing to report success on zero analyzed files."
            exit 1
          fi
          python3 tools/scripts/quality/run_clang_tidy.py "${cpp_files[@]}"

      - name: Commit automatic fixes
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "clang-tidy did not produce any source changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: apply clang-tidy automatic fixes"
          git push origin HEAD:main
