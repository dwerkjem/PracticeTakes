name: Build desktop packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to build
        required: false
        default: ""
        type: string
      version:
        description: Optional temporary semantic version for release preparation
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        description: Optional branch, tag, or commit to build
        required: false
        default: ""
        type: string
      version:
        description: Optional temporary semantic version for release preparation
        required: false
        default: ""
        type: string
    secrets:
      WINDOWS_CERT_PFX_BASE64:
        description: Base64-encoded Authenticode PKCS#12 signing certificate
        required: false
      WINDOWS_CERT_PASSWORD:
        description: Password protecting the Authenticode PKCS#12 file
        required: false
      APPLE_DEVELOPER_ID_CERT_P12:
        description: >-
          Base64-encoded PKCS#12 holding the Developer ID Application and
          Developer ID Installer certificates
        required: false
      APPLE_DEVELOPER_ID_CERT_PASSWORD:
        description: Password protecting the Developer ID PKCS#12 file
        required: false
      APPLE_DEVELOPER_ID_APPLICATION:
        description: Developer ID Application identity name
        required: false
      APPLE_DEVELOPER_ID_INSTALLER:
        description: Developer ID Installer identity name
        required: false
      APPLE_NOTARY_APPLE_ID:
        description: Apple ID that submits builds to the notary service
        required: false
      APPLE_NOTARY_PASSWORD:
        description: App-specific password for the notary service Apple ID
        required: false
      APPLE_TEAM_ID:
        description: Ten-character Apple Developer team identifier
        required: false

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            run_tests: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            run_tests: true
    runs-on: ${{ matrix.runner }}
    # Build on the oldest supported Linux release. Dynamically linked binaries
    # inherit the build system's glibc, libstdc++, and library package names, so
    # using a newer Debian release makes the resulting .deb uninstallable on
    # Debian 12 (for example, by requiring the newer t64 library packages).
    container: debian:12
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Bootstrap Debian runner
        run: |
          apt-get update
          apt-get install --yes ca-certificates ccache git python3

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Release builds pass an explicit version. Those compile every object
      # from source instead of trusting mutable Actions cache contents.
      - name: Restore Linux compiler cache
        if: ${{ inputs.version == '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache --zero-stats

      - name: Apply requested release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/scripts/release/version.py set "${RELEASE_VERSION}"

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(python3 tools/scripts/release/version.py current)" >> "${GITHUB_OUTPUT}"

      - name: Install Linux build dependencies
        run: bash tools/scripts/build/check-linux-build-dependencies.sh --install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING="${{ matrix.run_tests }}" \
            -DPRACTICE_TAKES_PACKAGE_FILE_NAME="PracticeTakes-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"

      - name: Build
        run: cmake --build build --config "${BUILD_TYPE}" --parallel

      - name: Report compiler cache performance
        run: ccache --show-stats

      - name: Test
        if: ${{ matrix.run_tests }}
        run: ctest --test-dir build --build-config "${BUILD_TYPE}" --output-on-failure

      - name: Package
        shell: bash
        run: |
          artifact_name="PracticeTakes-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"
          package_path="dist/${artifact_name}.deb"
          expected_architecture="${{ matrix.arch }}"

          if [[ "${expected_architecture}" == "x64" ]]; then
            expected_architecture=amd64
          fi

          cpack --config build/CPackConfig.cmake \
            -G DEB \
            -B dist

          if [[ ! -f "${package_path}" ]]; then
            echo "Expected Debian package was not created: ${package_path}" >&2
            exit 1
          fi

          actual_architecture="$(dpkg-deb --field "${package_path}" Architecture)"
          if [[ "${actual_architecture}" != "${expected_architecture}" ]]; then
            echo "Expected ${expected_architecture} package, got ${actual_architecture}." >&2
            exit 1
          fi

          dependencies="$(dpkg-deb --field "${package_path}" Depends)"
          if [[ -z "${dependencies}" ]]; then
            echo "The Debian package has no generated runtime dependencies." >&2
            exit 1
          fi

          dpkg-deb --contents "${package_path}" | grep -F "./usr/bin/PracticeTakes"
          dpkg-deb --contents "${package_path}" | \
            grep -F "./usr/share/applications/org.derekrneilson.practicetakes.desktop"

          # Exercise the same local-package APT path users follow. This catches
          # dependency metadata that cannot be satisfied on the support baseline.
          apt-get install --yes "./${package_path}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PracticeTakes-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/PracticeTakes-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            msvc_arch: amd64
            run_tests: true
          - runner: windows-11-arm
            arch: arm64
            msvc_arch: arm64
            run_tests: true
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The Authenticode steps below stay dormant until both certificate
      # secrets exist. Secrets cannot be read from a step `if:`, so the
      # decision is resolved here where the secrets context is available.
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Release builds pass an explicit version. Those compile every object
      # from source instead of trusting mutable Actions cache contents.
      - name: Restore Windows compiler cache
        if: ${{ inputs.version == '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Apply requested release version
        if: ${{ inputs.version != '' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python tools/scripts/release/version.py set "${env:RELEASE_VERSION}"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (python tools/scripts/release/version.py current).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Windows build tools
        shell: pwsh
        run: |
          # NSIS generates the shipped installer, so both Chocolatey packages
          # are pinned to explicit versions and bumped deliberately.
          # --allow-downgrade keeps the pins usable on runner images that
          # already carry a newer build of the same package, which Chocolatey
          # otherwise refuses to replace.
          choco install ccache --yes --no-progress --version 4.13.6 --allow-downgrade
          choco install nsis --yes --no-progress --version 3.12.0 --allow-downgrade
          ccache --max-size=1G
          ccache --zero-stats

      - name: Configure
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch "${{ matrix.msvc_arch }}" `
            -HostArch amd64 `
            -SkipAutomaticLocation

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE="${env:BUILD_TYPE}" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DBUILD_TESTING="${{ matrix.run_tests }}" `
            -DPRACTICE_TAKES_PACKAGE_FILE_NAME="PracticeTakes-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}"

      - name: Build
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch "${{ matrix.msvc_arch }}" `
            -HostArch amd64 `
            -SkipAutomaticLocation

          cmake --build build --config "${env:BUILD_TYPE}" --parallel

      - name: Report compiler cache performance
        shell: pwsh
        run: ccache --show-stats

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: pwsh
        run: ctest --test-dir build --build-config "${env:BUILD_TYPE}" --output-on-failure

      # Authenticode signing turns on when the repository owner creates:
      #   WINDOWS_CERT_PFX_BASE64 - base64 text of the PKCS#12 signing
      #                             certificate
      #   WINDOWS_CERT_PASSWORD   - password protecting that PKCS#12 file
      # Owners on Azure Trusted Signing can swap the signtool steps below for
      # azure/trusted-signing-action and keep the same WINDOWS_SIGNING_ENABLED
      # gate. Without the secrets the installer ships unsigned, exactly as it
      # does today.
      - name: Prepare Windows code signing
        if: ${{ env.WINDOWS_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $certificatePath = Join-Path "${env:RUNNER_TEMP}" "practice-takes-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String("${env:WINDOWS_CERT_PFX_BASE64}"))

          # Newest SDK first, preferring the runner's own architecture and
          # falling back to whatever the SDK does ship.
          $signtools = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -File -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending

          $signtoolArch = if ("${env:PROCESSOR_ARCHITECTURE}" -eq "ARM64") { "arm64" } else { "x64" }
          $signtool = $signtools |
            Where-Object { $_.FullName -like "*\$signtoolArch\*" } |
            Select-Object -First 1

          if (-not $signtool) {
            $signtool = $signtools | Select-Object -First 1
          }

          if (-not $signtool) {
            throw "signtool.exe was not found in the installed Windows SDK."
          }

          "PRACTICE_TAKES_SIGNTOOL=$($signtool.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRACTICE_TAKES_PFX=$certificatePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The application binary is signed before CPack collects it so the signed
      # copy is what the installer carries.
      - name: Sign Windows application binary
        if: ${{ env.WINDOWS_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $binaryPath = "build/bin/PracticeTakes.exe"

          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            throw "The application binary was not found at $binaryPath."
          }

          & "${env:PRACTICE_TAKES_SIGNTOOL}" sign `
            /f "${env:PRACTICE_TAKES_PFX}" `
            /p "${env:WINDOWS_CERT_PASSWORD}" `
            /fd sha256 `
            /tr "http://timestamp.digicert.com" `
            /td sha256 `
            (Resolve-Path -LiteralPath $binaryPath).Path
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for $binaryPath."
          }

      - name: Package
        shell: pwsh
        run: |
          $artifactName = "PracticeTakes-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}"
          $installerPath = "dist/$artifactName.exe"

          cpack --config build/CPackConfig.cmake `
            -G NSIS `
            -B dist `
            -C "${env:BUILD_TYPE}"

          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Expected Windows installer was not created: $installerPath"
          }

          $nsisScript = Get-ChildItem -Path dist -Recurse -File -Filter *.nsi |
            Select-Object -First 1
          if (-not $nsisScript) {
            throw "CPack did not leave an NSIS script for shortcut verification."
          }

          $nsisContent = Get-Content -LiteralPath $nsisScript.FullName -Raw
          if ($nsisContent -notmatch [regex]::Escape("Practice Takes.lnk") -or
              $nsisContent -notmatch [regex]::Escape("PracticeTakes.exe")) {
            throw "The Windows installer does not create the Practice Takes Start Menu shortcut."
          }

      # Signed last so the published installer, and therefore the checksum and
      # provenance recorded for it, cover the final bytes.
      - name: Sign Windows installer
        if: ${{ env.WINDOWS_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $artifactName = "PracticeTakes-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}"
          $installerPath = (Resolve-Path -LiteralPath "dist/$artifactName.exe").Path

          & "${env:PRACTICE_TAKES_SIGNTOOL}" sign `
            /f "${env:PRACTICE_TAKES_PFX}" `
            /p "${env:WINDOWS_CERT_PASSWORD}" `
            /fd sha256 `
            /tr "http://timestamp.digicert.com" `
            /td sha256 `
            $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for $installerPath."
          }

          & "${env:PRACTICE_TAKES_SIGNTOOL}" verify /pa $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "The signed installer did not pass Authenticode verification."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PracticeTakes-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}
          path: dist/PracticeTakes-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Discard Windows signing certificate
        if: ${{ always() && env.WINDOWS_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Remove-Item `
            -LiteralPath (Join-Path "${env:RUNNER_TEMP}" "practice-takes-authenticode.pfx") `
            -Force -ErrorAction SilentlyContinue

  macos:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            name: Intel x64
            arch: x64
            cmake_arch: x86_64
            run_tests: false
          - runner: macos-15
            name: Apple Silicon ARM64
            arch: arm64
            cmake_arch: arm64
            run_tests: false
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The Developer ID steps below stay dormant until the matching secrets
      # exist. Secrets cannot be read from a step `if:`, so both decisions are
      # resolved here where the secrets context is available.
      MACOS_SIGNING_ENABLED: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' && secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD != '' && secrets.APPLE_DEVELOPER_ID_APPLICATION != '' && secrets.APPLE_DEVELOPER_ID_INSTALLER != '' }}
      MACOS_NOTARIZATION_ENABLED: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' && secrets.APPLE_NOTARY_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Release builds pass an explicit version. Those compile every object
      # from source instead of trusting mutable Actions cache contents.
      - name: Restore macOS compiler cache
        if: ${{ inputs.version == '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install ccache
          ccache --max-size=1G
          ccache --zero-stats

      - name: Apply requested release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/scripts/release/version.py set "${RELEASE_VERSION}"

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(python3 tools/scripts/release/version.py current)" >> "${GITHUB_OUTPUT}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_TESTING="${{ matrix.run_tests }}"

      - name: Build
        run: cmake --build build --config "${BUILD_TYPE}" --parallel

      - name: Report compiler cache performance
        run: ccache --show-stats

      - name: Test
        if: ${{ matrix.run_tests }}
        run: ctest --test-dir build --build-config "${BUILD_TYPE}" --output-on-failure

      # Developer ID signing turns on when the repository owner creates:
      #   APPLE_DEVELOPER_ID_CERT_P12      - base64 text of a PKCS#12 holding
      #                                      both the Developer ID Application
      #                                      and Developer ID Installer
      #                                      identities
      #   APPLE_DEVELOPER_ID_CERT_PASSWORD - password protecting that PKCS#12
      #   APPLE_DEVELOPER_ID_APPLICATION   - "Developer ID Application: Name (TEAM)"
      #   APPLE_DEVELOPER_ID_INSTALLER     - "Developer ID Installer: Name (TEAM)"
      # Without them the Package step keeps its ad-hoc signature and the build
      # behaves exactly as it does today.
      - name: Import Apple Developer ID identities
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/practice-takes-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate_path="${RUNNER_TEMP}/practice-takes-developer-id.p12"

          printf '%s' "${APPLE_DEVELOPER_ID_CERT_P12}" | base64 --decode > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_DEVELOPER_ID_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}" > /dev/null

          # codesign only searches the keychains on the user search list.
          security list-keychains -d user -s "${keychain_path}" \
            $(security list-keychains -d user | sed 's/[",]//g')

          rm -f "${certificate_path}"

      - name: Package
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
        run: |
          # JUCE names the bundle after PRODUCT_NAME, so the directory keeps the
          # display name with its space. Only the published .pkg file name uses
          # the space-free form.
          app_path="$(find build -type d -name 'Practice Takes.app' -print -quit)"

          if [[ -z "${app_path}" ]]; then
            echo "Practice Takes.app was not found after the build." >&2
            exit 1
          fi

          artifact_name="PracticeTakes-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}"
          mkdir -p dist
          cp README.md LICENSE "${app_path}/Contents/Resources/"

          if [[ "${MACOS_SIGNING_ENABLED}" == "true" ]]; then
            codesign --force --deep --timestamp --options runtime \
              --sign "${APPLE_DEVELOPER_ID_APPLICATION}" "${app_path}"
          else
            codesign --force --deep --sign - "${app_path}"
          fi

          # pkgbuild marks bundles relocatable by default, which makes the
          # installer ask LaunchServices for an existing copy of this bundle ID
          # and install over that instead of /Applications. Anyone who kept an
          # old copy of the app outside /Applications would have it silently
          # overwritten and see nothing installed where they expected. Staging
          # through --root is what allows --component-plist, which is the only
          # way to turn relocation off.
          rm -rf staging
          mkdir staging
          ditto "${app_path}" "staging/$(basename "${app_path}")"

          pkgbuild --analyze --root staging component.plist
          plutil -replace 0.BundleIsRelocatable -bool false component.plist

          if ! plutil -convert xml1 component.plist -o - \
            | grep -A1 "<key>BundleIsRelocatable</key>" | grep -q "<false/>"; then
            echo "BundleIsRelocatable was not turned off:" >&2
            plutil -convert xml1 component.plist -o - >&2
            exit 1
          fi

          # --root preserves the build user's ownership by default, which would
          # install an app owned by a uid that means nothing on the user's
          # machine. "recommended" hands it to root:wheel like any other
          # /Applications install.
          pkgbuild \
            --root staging \
            --component-plist component.plist \
            --identifier org.derekrneilson.practicetakes.pkg \
            --version "${{ steps.version.outputs.version }}" \
            --install-location /Applications \
            --ownership recommended \
            "dist/${artifact_name}.pkg"

          pkgutil --payload-files "dist/${artifact_name}.pkg" | \
            grep -F "Practice Takes.app/Contents/MacOS/Practice Takes"

          if [[ "${MACOS_SIGNING_ENABLED}" == "true" ]]; then
            mv "dist/${artifact_name}.pkg" "dist/${artifact_name}-unsigned.pkg"
            productsign --sign "${APPLE_DEVELOPER_ID_INSTALLER}" \
              "dist/${artifact_name}-unsigned.pkg" \
              "dist/${artifact_name}.pkg"
            rm -f "dist/${artifact_name}-unsigned.pkg"
            pkgutil --check-signature "dist/${artifact_name}.pkg"
          fi

      # A .pkg can build, sign, and notarize cleanly while containing a bundle
      # macOS refuses to launch, which is exactly how 0.5.6 shipped: the binary
      # had been renamed out from under CFBundleExecutable. These assertions run
      # against the built bundle and again against the one the installer
      # actually places in /Applications, so packaging is checked end to end
      # rather than only for the presence of a payload path.
      - name: Verify macOS bundle and installed package
        run: |
          set -euo pipefail

          verify_bundle() {
            local bundle="$1"
            local label="$2"
            local plist="${bundle}/Contents/Info.plist"

            echo "== ${label}: ${bundle}"

            if [[ ! -f "${plist}" ]]; then
              echo "${label}: Info.plist is missing." >&2
              return 1
            fi

            # plutil exits non-zero for a missing key. PlistBuddy would instead
            # print its error to stdout and read back as a plausible value.
            local executable_name
            if ! executable_name="$(plutil -extract CFBundleExecutable raw -o - "${plist}")"; then
              echo "${label}: Info.plist has no CFBundleExecutable." >&2
              return 1
            fi

            if [[ ! -x "${bundle}/Contents/MacOS/${executable_name}" ]]; then
              echo "${label}: CFBundleExecutable is '${executable_name}' but" \
                   "Contents/MacOS/${executable_name} is not an executable file." >&2
              ls -l "${bundle}/Contents/MacOS" >&2
              return 1
            fi

            # An audio-input app without this key is killed by TCC on first
            # capture, so ship it or the tuner cannot work at all.
            local microphone_usage
            if ! microphone_usage="$(plutil -extract NSMicrophoneUsageDescription raw -o - "${plist}")" \
              || [[ -z "${microphone_usage}" ]]; then
              echo "${label}: Info.plist has no usable NSMicrophoneUsageDescription." >&2
              return 1
            fi

            codesign --verify --deep --strict --verbose=2 "${bundle}"

            echo "${label}: executable '${executable_name}' and microphone usage description present."
          }

          app_path="$(find build -type d -name 'Practice Takes.app' -print -quit)"
          verify_bundle "${app_path}" "built bundle"

          package_path="dist/PracticeTakes-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.pkg"

          # A relocatable payload installs over whatever copy of the bundle
          # LaunchServices happens to know about rather than /Applications, so
          # the install below would be testing an unpredictable destination.
          rm -rf expanded
          pkgutil --expand "${package_path}" expanded

          if grep -q "<relocate>" expanded/PackageInfo; then
            echo "The package payload is still relocatable:" >&2
            cat expanded/PackageInfo >&2
            exit 1
          fi

          sudo installer -pkg "${package_path}" -target / -verbose

          installed_path="/Applications/Practice Takes.app"

          if [[ ! -d "${installed_path}" ]]; then
            echo "The installer did not place the bundle at ${installed_path}." >&2
            pkgutil --pkg-info org.derekrneilson.practicetakes.pkg >&2 || true
            pkgutil --files org.derekrneilson.practicetakes.pkg >&2 || true
            ls -l /Applications >&2
            exit 1
          fi

          verify_bundle "${installed_path}" "installed bundle"

      # Notarization turns on when the repository owner creates, alongside the
      # APPLE_DEVELOPER_ID_* secrets above:
      #   APPLE_NOTARY_APPLE_ID - Apple ID that owns the Developer ID
      #   APPLE_NOTARY_PASSWORD - app-specific password for that Apple ID
      #   APPLE_TEAM_ID         - ten-character Apple Developer team identifier
      # Stapling rewrites the package, so this runs before the upload that the
      # release checksums and provenance are taken from.
      - name: Notarize and staple macOS installer
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' && env.MACOS_NOTARIZATION_ENABLED == 'true' }}
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          package_path="dist/PracticeTakes-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.pkg"

          xcrun notarytool submit "${package_path}" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          xcrun stapler staple "${package_path}"
          xcrun stapler validate "${package_path}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PracticeTakes-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/PracticeTakes-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Discard Apple signing keychain
        if: ${{ always() && env.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          keychain_path="${RUNNER_TEMP}/practice-takes-signing.keychain-db"
          rm -f "${RUNNER_TEMP}/practice-takes-developer-id.p12"

          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi

  linux-compatibility:
    name: Install Linux ${{ matrix.arch }} package on ${{ matrix.name }}
    needs:
      - linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            dpkg_arch: amd64
            name: Debian 12
            container: debian:12
          - runner: ubuntu-24.04-arm
            arch: arm64
            dpkg_arch: arm64
            name: Debian 12
            container: debian:12
          - runner: ubuntu-24.04
            arch: x64
            dpkg_arch: amd64
            name: Debian 13
            container: debian:13
          - runner: ubuntu-24.04-arm
            arch: arm64
            dpkg_arch: arm64
            name: Debian 13
            container: debian:13
          - runner: ubuntu-24.04
            arch: x64
            dpkg_arch: amd64
            name: Ubuntu 22.04
            container: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            arch: arm64
            dpkg_arch: arm64
            name: Ubuntu 22.04
            container: ubuntu:22.04
          - runner: ubuntu-24.04
            arch: x64
            dpkg_arch: amd64
            name: Ubuntu 24.04
            container: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            arch: arm64
            dpkg_arch: arm64
            name: Ubuntu 24.04
            container: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    steps:
      - name: Bootstrap package test
        run: |
          apt-get update
          apt-get install --yes ca-certificates

      - name: Download Linux package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: PracticeTakes-*-linux-${{ matrix.arch }}
          path: dist
          merge-multiple: true

      - name: Install and verify Linux package
        shell: bash
        run: |
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb')

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one .deb, found ${#packages[@]}." >&2
            exit 1
          fi

          package_path="${packages[0]}"
          actual_architecture="$(dpkg-deb --field "${package_path}" Architecture)"

          if [[ "${actual_architecture}" != "${{ matrix.dpkg_arch }}" ]]; then
            echo "Expected ${{ matrix.dpkg_arch }} package, got ${actual_architecture}." >&2
            exit 1
          fi

          apt-get install --yes --no-install-recommends "./${package_path}"
          dpkg-query --show --showformat='${Status}\n' practice-takes | \
            grep -Fx "install ok installed"

          if ldd /usr/bin/PracticeTakes | grep -F "not found"; then
            echo "Practice Takes has unresolved shared-library dependencies." >&2
            exit 1
          fi

  release-assets:
    name: Assemble release artifact bundle
    needs:
      - linux
      - linux-compatibility
      - windows
      - macos
    runs-on: ubuntu-24.04

    steps:
      - name: Check out build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Apply requested release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/scripts/release/version.py set "${RELEASE_VERSION}"

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=$(python3 tools/scripts/release/version.py current)" >> "${GITHUB_OUTPUT}"
          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Download platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: PracticeTakes-${{ steps.metadata.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum release assets
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"

          expected_files=(
            "PracticeTakes-${version}-linux-x64.deb"
            "PracticeTakes-${version}-linux-arm64.deb"
            "PracticeTakes-${version}-windows-x64.exe"
            "PracticeTakes-${version}-windows-arm64.exe"
            "PracticeTakes-${version}-macos-x64.pkg"
            "PracticeTakes-${version}-macos-arm64.pkg"
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -f "release-assets/${file}" ]]; then
              echo "Missing expected build artifact: ${file}" >&2
              exit 1
            fi
          done

          actual_count="$(find release-assets -maxdepth 1 -type f -name 'PracticeTakes-*' | wc -l)"
          if [[ "${actual_count}" -ne "${#expected_files[@]}" ]]; then
            echo "Expected ${#expected_files[@]} platform packages, found ${actual_count}." >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          if [[ "$(dpkg-deb --field "release-assets/PracticeTakes-${version}-linux-x64.deb" Architecture)" != "amd64" ]]; then
            echo "The Linux x64 artifact is not an amd64 Debian package." >&2
            exit 1
          fi

          if [[ "$(dpkg-deb --field "release-assets/PracticeTakes-${version}-linux-arm64.deb" Architecture)" != "arm64" ]]; then
            echo "The Linux ARM64 artifact is not an arm64 Debian package." >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum PracticeTakes-* > SHA256SUMS.txt
          )

          {
            echo "Version: ${version}"
            echo "Source SHA: ${{ steps.metadata.outputs.source_sha }}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-assets/BUILD-METADATA.txt

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PracticeTakes-${{ steps.metadata.outputs.version }}-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
