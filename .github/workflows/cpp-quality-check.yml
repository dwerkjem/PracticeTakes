name: C++ quality check

on:
  pull_request:
    paths:
      - "src/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "cmake/**"
      - "scripts/quality/run_clang_format.py"
      - "scripts/quality/run_clang_tidy.py"
      - "scripts/build/check-linux-build-dependencies.sh"
      - ".github/workflows/cpp-quality-check.yml"

permissions:
  contents: read

jobs:
  cpp-quality:
    name: Format and lint changed C++
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Install analysis dependencies
        run: |
          bash scripts/build/check-linux-build-dependencies.sh --install
          sudo apt-get install --yes clang-format clang-tidy

      - name: Configure compilation database
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Generate JUCE headers and validate compilation
        run: cmake --build build --target PracticeTakes --parallel

      - name: Check clang-format compliance
        shell: bash
        run: |
          mapfile -t cpp_files < <(find src -type f -name "*.cpp" | sort)
          mapfile -t header_files < <(find src -type f -name "*.h" | sort)
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "::error::No .cpp files discovered under src/ - refusing to report success on zero analyzed files."
            exit 1
          fi
          clang-format --dry-run --Werror --style=file "${cpp_files[@]}" "${header_files[@]}"

      - name: Check clang-tidy findings
        shell: bash
        run: |
          mapfile -t cpp_files < <(find src -type f -name "*.cpp" | sort)
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "::error::No .cpp files discovered under src/ - refusing to report success on zero analyzed files."
            exit 1
          fi
          python3 scripts/quality/run_clang_tidy.py "${cpp_files[@]}"
