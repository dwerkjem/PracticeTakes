name: CodeQL security scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - cpp
          - javascript-typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Install Linux build dependencies
        if: ${{ matrix.language == 'cpp' }}
        run: bash scripts/build/check-linux-build-dependencies.sh --install

      - name: Configure CMake (C++)
        if: ${{ matrix.language == 'cpp' }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build C++ target for CodeQL
        if: ${{ matrix.language == 'cpp' }}
        run: cmake --build build --target PracticeTakes --parallel

      - name: Install service dependencies (JS/TS)
        if: ${{ matrix.language == 'javascript-typescript' }}
        run: npm ci --prefix services

      - name: Autobuild (JS/TS)
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
