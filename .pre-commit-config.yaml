default_install_hook_types:
  - pre-commit
  - pre-merge-commit
default_stages:
  - pre-commit
repos:
  - repo: local
    hooks:
      # Git will not read merge-driver definitions out of a cloned repository,
      # so .gitattributes can name a driver but not define one. This installs
      # them into the clone's own config. Idempotent and silent once set, so it
      # costs a few config reads per commit and self-heals a stale value.
      - id: git-merge-config
        name: Install this repository's Git merge configuration
        entry: python3 tools/scripts/git/configure_merge.py
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
          - pre-merge-commit
      # Encrypted mirrors are no longer committed, so there is nothing left for
      # this hook to stage. What remains is the half that prevents accidents:
      # keeping plaintext secrets out of the index. Refreshing the mirrors is
      # the `encrypt` command, run deliberately rather than on every commit.
      - id: sops-secrets
        name: Keep plaintext secrets out of the Git index
        entry: python3 tools/scripts/secrets/secrets_manager.py pre-commit
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: sops-secret-audit
        name: Reject tracked plaintext files matching tools/secret-patterns
        entry: python3 tools/scripts/secrets/secrets_manager.py audit
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages:
          - pre-commit
          - pre-merge-commit
      - id: clang-format
        name: Format C++ with clang-format
        entry: python3 tools/scripts/quality/run_clang_format.py
        language: python
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
        # Pinned so the hook formats with the same version CI checks with.
        # Without this the hook used whatever clang-format was on PATH -- 21.1.8
        # on a current distribution -- which disagrees with CI's 18.1.8 at the
        # column limit, so a tree could be clean locally and red in CI. Because
        # language: python builds this hook its own environment, the pinned
        # binary lands on PATH ahead of the system one.
        #
        # Keep this version in step with the `coverage` extra in pyproject.toml,
        # which pins it for `uv run` and for the coverage tooling.
        additional_dependencies:
          - clang-format==18.1.8
