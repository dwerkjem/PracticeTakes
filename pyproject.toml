[project]
name = "practice-takes-tools"
version = "0.1.0"
description = "Repository tooling for Practice Takes. Not the shipped application."
requires-python = ">=3.13"

# Deliberately empty. The scripts `pre-commit` invokes -- both secrets-manager
# hooks and the C++ formatter -- and everything CI runs on the runner's
# preinstalled interpreter are standard-library only, and must stay that way:
# they run on whatever `python3` a contributor happens to have.
#
# Anything that needs a real library declares it as an optional group below, so
# taking a dependency is always a scoped decision rather than something the
# commit gate inherits.
dependencies = []

[project.optional-dependencies]
# The manual GUI verification harness (scripts/manual_gui/). A local
# development tool: it needs a real display, a real audio device, and a human,
# so no CI check depends on it.
manual-gui = ["textual>=8.2,<9"]

# Coverage reporting. CI installs these; the scripts degrade with a clear
# message when they are absent rather than failing a run over a report.
coverage = ["gcovr>=8,<9", "coverage>=7"]

[tool.setuptools]
# No package to build -- this file exists to declare tooling dependencies, not
# to publish anything.
packages = []
